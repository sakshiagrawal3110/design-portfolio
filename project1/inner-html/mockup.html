e=\"display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #E4E1F2\"><span style=\"color:#5E5A7A\">Booking ID<\u002Fspan><span style=\"font-weight:700\">{{ v.bookedRef }}<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #E4E1F2\"><span style=\"color:#5E5A7A\">Wallet balance now<\u002Fspan><span style=\"font-weight:700\">{{ v.catBal }}<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <button sc-camel-on-click=\"{{ go.rewards }}\" style=\"height:56px;border-radius:16px;font-size:16px;font-weight:700;background:#2A1E7A;color:#fff;margin-top:auto\">Back to rewards<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<!-- NAV -->\n<sc-if value=\"{{ v.showNav }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;border-top:1px solid #E4E1F2;background:#fff;padding:6px 12px 14px\">\n  <sc-for list=\"{{ navItems }}\" as=\"n\" hint-placeholder-count=\"3\">\n    <button sc-camel-on-click=\"{{ n.go }}\" style=\"flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:{{ n.color }}\">\n      <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{ n.icon }}\"><\u002Fpath><\u002Fsvg>{{ n.label }}\n    <\u002Fbutton>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;start&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;splash&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}\">\nconst ICON = {\n  home: 'M3 11.5 12 4l9 7.5M5.5 10v9.5h13V10M10 19.5v-5h4v5',\n  gift: 'M4 10h16v10H4zM3 7h18v3H3zM12 7v13M12 7C10 3.5 6 4 7.5 7M12 7c2-3.5 6-3 4.5 0',\n  pay: 'M4 20 20 4M9 4h11v11',\n  b  acc: 'A/c •• 8841 · IFSC SPND0002207' },\n  { name: 'Dad', ini: 'D', upi: 'dad.k@spendit', acc: 'A/c •• 1063 · IFSC SPND0000056' },\n  { name: 'Sana Khan', ini: 'SK', upi: 'sana.k@spendit', acc: 'A/c •• 7712 · IFSC SPND0000921' },\n  { name: 'Kabir Singh', ini: 'KS', upi: 'kabir.s@spendit', acc: 'A/c •• 3045 · IFSC SPND0001388' }\n];\nconst CATS = [\n  { id: 'shop', name: 'Shopping', color: '#C2255C', icon: ICON.bag, min: 500 },\n  { id: 'hotel', name: 'Hotels', color: '#0B7285', icon: ICON.bed, min: 2000 },\n  { id: 'flight', name: 'Flights', color: '#1864AB', icon: ICON.plane, min: 4000 },\n  { id: 'movie', name: 'Movies', color: '#B35900', icon: ICON.ticket, min: 250 }\n];\nconst ITEMS = {\n  movie: [\n    { t: 'Evening show, 2 tickets', s: 'Any cinema on Spendit, weekdays', c: 300 },\n    { t: 'Weekend premium show, 2 tickets', s: 'Recliner seats, Saturday and Sunday', c: 450 }\n  ],\n  shop: [\n    { t: '₹500 shopping voucher', s: 'Valid at partner stores', c: 500 },\n    { t: '₹1,000 shopping voucher', s: 'Valid at partner stores', c: 1000 }\n  ],\n  hotel: [\n    { t: '1 night, Goa beach stay', s: 'Breakfast included', c: 2000 },\n    { t: '2 nights, Jaipur heritage stay', s: 'Breakfast included', c: 3600 }\n  ],\n  flight: [\n    { t: 'Mumbai to Bengaluru, one way', s: 'Economy, flexible date', c: 3800 },\n    { t: 'Mumbai to Delhi, one way', s: 'Economy, flexible date', c: 4400 }\n  ]\n};\nconst BASE_TXNS = [\n  { ini: 'CB', name: 'Café Bloom', method: 'UPI', amt: 380, pts: 38, day: 'Yesterday' },\n  { ini: 'MS', name: 'Meera Shah', method: 'NEFT', amt: 18000, pts: 360, day: '18 Nov' },\n  { ini: 'SK', name: 'Sana Khan', method: 'IMPS', amt: 1200, pts: 60, day: '16 Nov' }\n];\nconst fmt = (n) => Number(n).toLocaleString('en-IN');\nconst FAMILY = [{ name: 'Ma', ini: 'M' }, { name: 'Dad', ini: 'D' }, { name: 'Riya', ini: 'R' }];\nconst FRIENDS = [{ name: 'Rohan', ini: 'RM', r: 0 }, { name: 'Sana', ini: 'SK', r: 4 }, { name: 'Kabir', ini: 'KS', r: 5 }];\nconst PEOPLE = [FAMILY[0], FAMILY[1], FAMILY[2], FRIENDS[0], FRIENDS[1], FRIENDS[2]];\nconst GMSG = ['Happy birthday!', 'Thank you!', 'Enjoy the movie!'];\nconst VNAMES = ['Trip', 'Gadget', 'Emergency', 'Wedding'];\nconst TODAY = Date.UTC(2026, 10, 21);\nconst addMonths = (m) => { const d = new Date(TODAY); d.setUTCMonth(d.getUTCMonth() + m); return d.getTime(); };\nconst dateText = (t) => new Date(t).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });\nconst daysLeft = (t) => Math.max(0, Math.round((t - TODAY) / 86400000));\nconst bonusFor = (a) => Math.floor(a / 100) * 2;\n\nclass Component extends DCLogic {\n  state = {};\n  d() {\n    const s = this.props.start || 'splash';\n    const b = {\n      screen: s, method: 'upi', amount: '', recipient: 0, pin: '', earned: 0, pending: 0, hidden: false, bal: 48250,\n      wallet: { shop: 640, hotel: 1820, flight: 4200, movie: 310 },\n      split: { shop: 0, hotel: 0, flight: 0, movie: 0 },\n      cat: 'movie', item: 0, lastAdded: 0, history: [],\n      boost: false, pool: 25000, famGot: [0, 0, 0], shareAmt: [0, 0, 0], shareSent: null,\n      giftCat: 'movie', giftTo: 3, giftAmt: 50, giftMsg: 2, gifted: null,\n      billTotal: 1200, billMode: 'equal', billWho: [false, false, false, true, true, false], billCustom: {}, billDone: null,\n      vaults: [\n        { name: 'Goa trip', type: 'locker', amt: 12000, unlock: addMonths(4) },\n        { name: 'Emergency fund', type: 'safe', amt: 8000, unlock: 0 }\n      ],\n      vType: 'locker', vName: 0, vAmt: 5000, vMonths: 6, vAck: false,\n      booked: { title: 'Evening show, 2 tickets', cost: 300, ref: 'SP-BK-48210' }\n    };\n    if (s === 'pay' || s === 'pin' || s === 'success' || s === 'split') b.amount = '400';\n    if (s === 'success' || s === 'split') { b.earned = 40; b.pending = 40; }\n    if (s === 'share') b.shareAmt = [1000, 2000, 500];\n    return b;\n  }\n  v() { return { ...this.d(), ...this.state }; }\n\n  more(s, set, W) {\n    const chip = (on) => ({ bg: on ? '#2A1E7A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#2A1E7A', bd: on ? '#2A1E7A' : '#CFCAEA' });\n    const catTile = (c) => 'width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;background:' + c.color + ';color:#fff';\n\n    // navigation\n    const goTo = (screen, extra) => () => set({ screen: screen, ...(extra || {}) });\n    const nav = {\n      circle: goTo('circle'), vault: goTo('vault'), vaultNew: goTo('vaultNew'), bill: goTo('bill'),\n      share: goTo('share'), gift: goTo('gift'), rewards: goTo('rewards')\n    };\n\n    // boost\n    const boostOn = s.boost;\n\n    // gift points\n    const gc = CATS.find((c) => c.id === s.giftCat);\n    const gBal = W[s.giftCat];\n    const gp = PEOPLE[s.giftTo];\n    const gOk = s.giftAmt >= 10 && s.giftAmt <= gBal;\n    const gd = s.gifted || { to: 'Rohan', amt: 50, cat: 'Movies', msg: 'Enjoy the movie!' };\n    const giftWallets = CATS.map((c) => {\n      const on = c.id === s.giftCat;\n      return {\n        name: c.name, balText: fmt(W[c.id]) + ' pts', bg: on ? c.color : '#FFFFFF', fg: on ? '#FFFFFF' : '#14112E', bd: on ? c.color : '#E4E1F2',\n        pick: () => set({ giftCat: c.id, giftAmt: Math.min(s.giftAmt, Math.max(10, Math.floor(W[c.id] / 10) * 10)) })\n      };\n    });\n    const giftPeople = PEOPLE.map((p, i) => ({\n      ini: p.ini, name: p.name, bg: i === s.giftTo ? '#2A1E7A' : '#E6E2FA', fg: i === s.giftTo ? '#FFFFFF' : '#2A1E7A',\n      ring: i === s.giftTo ? '#14112E' : 'transparent', pick: () => set({ giftTo: i })\n    }));\n    const giftMsgs = GMSG.map((t, i) => { const c = chip(i === s.giftMsg); return { t: t, bg: c.bg, fg: c.fg, bd: c.bd, pick: () => set({ giftMsg: i }) }; });\n\n    // circle\n    const famRows = FAMILY.map((p, i) => ({\n      ini: p.ini, name: p.name, got: s.famGot[i] > 0 ? 'Received ₹' + fmt(s.famGot[i]) + ' this month' : 'Nothing sent this month'\n    }));\n    const friendRows = FRIENDS.map((p) => ({\n      ini: p.ini, name: p.name,\n      pay: () => set({ screen: 'pay', recipient: p.r, amount: '', method: 'upi' }),\n      gift: () => set({ screen: 'gift', giftTo: PEOPLE.findIndex((x) => x.name === p.name) })\n    }));\n\n    // group share from the family pool\n    const shareTotal = s.shareAmt.reduce((a, b) => a + b, 0);\n    const shareCount = s.shareAmt.filter((x) => x > 0).length;\n    const shareOk = shareTotal > 0 && shareTotal <= s.pool;\n    const shareRows = FAMILY.map((p, i) => ({\n      ini: p.ini, name: p.name, val: '₹' + fmt(s.shareAmt[i]),\n      got: s.famGot[i] > 0 ? 'Received ₹' + fmt(s.famGot[i]) + ' so far' : 'Nothing yet this month',\n      decLabel: 'Decrease amount for ' + p.name, incLabel: 'Increase amount for ' + p.name,\n      decOp: s.shareAmt[i] === 0 ? 0.35 : 1, incOp: shareTotal + 500 > s.pool ? 0.35 : 1,\n      dec: () => { const a = s.shareAmt.slice(); a[i] = Math.max(0, a[i] - 500); set({ shareAmt: a }); },\n      inc: () => { if (shareTotal + 500 > s.pool) return; const a = s.shareAmt.slice(); a[i] += 500; set({ shareAmt: a }); }\n    }));\n    const sharePresets = [\n      { label: '₹1,000 each', pick: () => set({ shareAmt: [1000, 1000, 1000] }) },\n      { label: '₹2,000 each', pick: () => set({ shareAmt: [2000, 2000, 2000] }) },\n      { label: 'Clear', pick: () => set({ shareAmt: [0, 0, 0] }) }\n    ];\n    const sent = s.shareSent || { amts: [1000, 2000, 500], total: 3500 };\n    const sentRows = FAMILY.map((p, i) => ({ ini: p.ini, name: p.name, amtText: '₹' + fmt(sent.amts[i]), has: sent.amts[i] > 0 })).filter((r) => r.has);\n\n    // split a bill\n    const who = [];\n    s.billWho.forEach((on, i) => { if (on) who.push(i); });\n    const parts = ['me'].concat(who);\n    const nP = parts.length;\n    const baseShare = Math.floor(s.billTotal / nP);\n    const remShare = s.billTotal - baseShare * nP;\n    const eq = {};\n    parts.forEach((k, j) => { eq[k] = baseShare + (j === 0 ? remShare : 0); });\n    const custom = s.billMode === 'custom';\n    const amtOf = (k) => (custom ? (s.billCustom[k] || 0) : eq[k]);\n    const custSum = parts.reduce((a, k) => a + (s.billCustom[k] || 0), 0);\n    const left = s.billTotal - custSum;\n    const billOk = who.length > 0 && (!custom || left === 0);\n    const resetBill = { billCustom: {}, billMode: 'equal' };\n    const billWhoChips = PEOPLE.map((p, i) => {\n      const c = chip(s.billWho[i]);\n      return { name: p.name, bg: c.bg, fg: c.fg, bd: c.bd, pick: () => { const a = s.billWho.slice(); a[i] = !a[i]; set({ billWho: a, ...resetBill }); } };\n    });\n    const billTotals = [500, 1200, 2500, 5000].map((t) => {\n      const c = chip(s.billTotal === t);\n      return { label: '₹' + fmt(t), bg: c.bg, fg: c.fg, bd: c.bd, pick: () => set({ billTotal: t, ...resetBill }) };\n    });\n    const billModes = [\n      { label: 'Equal', bg: !custom ? '#2A1E7A' : 'transparent', fg: !custom ? '#FFFFFF' : '#2A1E7A', pick: () => set({ billMode: 'equal' }) },\n      { label: 'Custom', bg: custom ? '#2A1E7A' : 'transparent', fg: custom ? '#FFFFFF' : '#2A1E7A', pick: () => set({ billMode: 'custom', billCustom: { ...eq } }) }\n    ];\n    const billRows = parts.map((k) => {\n      const nm = k === 'me' ? 'You' : PEOPLE[k].name;\n      return {\n        name: nm, ini: k === 'me' ? 'A' : PEOPLE[k].ini, amt: '₹' + fmt(amtOf(k)), custom: custom,\n        sub: k === 'me' ? (custom ? 'Your share' : (remShare > 0 ? 'Includes the extra ₹' + remShare : 'Your share')) : 'Will get a request',\n        decLabel: 'Decrease ' + nm, incLabel: 'Increase ' + nm,\n        decOp: (s.billCustom[k] || 0) === 0 ? 0.35 : 1, incOp: left === 0 ? 0.35 : 1,\n        dec: () => { const c = { ...s.billCustom }; c[k] = Math.max(0, (c[k] || 0) - 100); set({ billCustom: c }); },\n        inc: () => { const x = Math.min(100, left); if (x <= 0) return; const c = { ...s.billCustom }; c[k] = (c[k] || 0) + x; set({ billCustom: c }); }\n      };\n    });\n    const sendBill = () => {\n A',\n        open: () => set({ screen: 'redeem', cat: c.id, item: 0 })\n      };\n    });\n\n    const bal = W[s.cat];\n    const unlockedCat = bal >= cat.min;\n    const list = ITEMS[s.cat];\n    const sel = list[s.item] || list[0];\n    const canBook = unlockedCat && bal >= sel.c;\n    const items = list.map((it, i) => ({\n      t: it.t, s: it.s, costText: fmt(it.c) + ' pts',\n      bd: i === s.item ? '#2A1E7A' : '#E4E1F2', op: bal >= it.c && unlockedCat ? 1 : 0.6,\n      pick: () => set({ item: i })\n    }));\n    const book = () => {\n      if (!canBook) return;\n      set({\n        wallet: { ...W, [s.cat]: bal - sel.c }, screen: 'redeemDone',\n        booked: { title: sel.t, cost: sel.c, ref: 'SP-BK-' + (48000 + sel.c) }\n      });\n    };\n\n    const txns = [...s.history, ...BASE_TXNS].slice(0, 3).map((t) => ({\n      ini: t.ini, name: t.name, meta: t.method + ' · ' + t.day,\n      amtText: '−₹' + fmt(t.amt), ptsText: '+' + fmt(t.pts) + ' pts'\n    }));\n    const startPay = (i) => () => set({ screen: 'pay', recipient: i, amount: '', method: 'upi' });\n    const recents = RECIP.slice(0, 4).map((r, i) => ({ ini: r.ini, first: r.name.split(' ')[0], pick: startPay(i) }));\n    const tiles = [\n      { label: 'Scan', icon: ICON.scan, go: () => set({ screen: 'pay', method: 'upi', amount: '' }) },\n      { label: 'UPI', icon: ICON.pay, go: () => set({ screen: 'pay', method: 'upi', amount: '' }) },\n      { label: 'IMPS', icon: ICON.bolt, go: () => set({ screen: 'pay', method: 'imps', amount: '' }) },\n      { label: 'NEFT', icon: ICON.bank, go: () => set({ screen: 'pay', method: 'neft', amount: '' }) }\n    ];\n    const methods = METHODS.map((x) => ({\n      label: x.label, bg: x.id === s.method ? '#2A1E7A' : 'transparent', fg: x.id === s.method ? '#FFFFFF' : '#2A1E7A',\n      pick: () => set({ method: x.id })\n    }));\n    const tab = (ids, label, ic, fn) => ({ label: label, icon: ic, go: fn, color: ids.indexOf(s.screen) >= 0 ? '#2A1E7A' : '#5E5A7A' });\n    const navItems = [\n      tab(['home'], 'Home', ICON.home, go.home),\n      tab(['pay'], 'Pay', ICON.pay, go.pay),\n      tab(['rewards', 'redeem', 'redeemDone', 'gift', 'giftDone'], 'Rewards', ICON.gift, go.rewards),\n      tab(['circle', 'share', 'shareDone', 'bill', 'billDone'], 'Circle', ICON.users, () => set({ screen: 'circle' })),\n      tab(['vault', 'vaultNew'], 'Vault', ICON.vault, () => set({ screen: 'vault' }))\n    ];\n\n    const is = {};\n    ['splash', 'home', 'pay', 'pin', 'success', 'split', 'rewards', 'redeem', 'redeemDone', 'circle', 'share', 'shareDone', 'gift', 'giftDone', 'bill', 'billDone', 'vault', 'vaultNew'].forEach((k) => { is[k] = s.screen === k; });\n    const payOk = amt > 0 && !over;\n\n    const X = this.more(s, set, W);\n    return {\n      w: X, icon: ICON, is: is, go: go, tiles: tiles, cats: cats, recents: recents, txns: txns, methods: methods,\n      payKeys: payKeys, pinKeys: pinKeys, pinDots: pinDots, presets: presets, splitRows: splitRows, items: items, navItems: navItems,\n      toggleEye: () => set({ hidden: !s.hidden }),\n      changeRecipient: () => set({ recipient: (s.recipient + 1) % RECIP.length }),\n      payNow: () => { if (payOk) set({ screen: 'pin', pin: '' }); },\n      confirmSplit: confirmSplit, book: book,\n      v: {\n        showNav: ['home', 'pay', 'rewards', 'circle', 'vault'].indexOf(s.screen) >= 0,\n        eyeIcon: s.hidden ? ICON.eyeoff : ICON.eye, eyeLabel: s.hidden ? 'Show balance' : 'Hide balance',\n        balance: s.hidden ? '₹ ••••••' : '₹ ' + s.bal.toLocaleString('en-IN', { minimumFractionDigits: 2 }),\n        totalText: fmt(total), hasPending: s.pending > 0, pendingText: fmt(s.pending) + ' points are waiting. Choose where they go.',\n        methodNote: m.note, rIni: rc.ini, rName: rc.name, rDetail: s.method === 'upi' ? rc.upi : rc.acc,\n        amountText: amt > 0 ? '₹ ' + fmt(amt) : '₹ 0', amtColor: amt > 0 ? '#14112E' : '#6B6788',\n        errText: over ? 'The ' + m.label + ' limit is ₹' + fmt(m.max) : '',\n        earnPreview: preview > 0 ? \"You'll earn \" + fmt(preview) + ' points' + (s.boost ? ' (2× boost on)' : '') :'Earn 1 point for every ₹' + m.rate + ' spent',\n        payDisabled: !payOk, payOpacity: payOk ? 1 : 0.4, payLabel: amt > 0 ? 'Pay ₹' + fmt(amt) : 'Enter an amount',\n        pinSub: 'Paying ₹' + fmt(amt) + ' to ' + rc.name + ' via ' + m.label,\n        paidText: '₹' + fmt(amt), paidSub: 'paid to ' + rc.name, methodLabel: m.label,\n        hasEarned: s.earned > 0, earnedText: 'You earned ' + fmt(s.earned) + ' points',\n        doneLabel: s.pending > 0 ? 'Decide later' : 'Done',\n        splitSub: fmt(s.earned) + ' points from your last payment',\n        unassignedText: fmt(unassigned), splitDisabled: unassigned !== 0, splitOpacity: unassigned === 0 ? 1 : 0.4,\n        splitLabel: unassigned === 0 ? 'Add to my wallets' : 'Assign ' + fmt(unassigned) + ' more to continue',\n        hasAdded: s.lastAdded > 0, addedText: '+' + fmt(s.lastAdded) + ' points added just now',\n        catName: cat.name, catIcon: cat.icon, catTile: tile(cat), catBal: fmt(bal) + ' pts',\n        lockText: unlockedCat ? 'Unlocked. You can book completely with points.' : 'Unlocks at ' + fmt(cat.min) + ' points. You are ' + fmt(cat.min - bal) + ' away.',\n        lockStyle: 'font-size:13px;font-weight:600;border-radius:12px;padding:10px 14px;' + (unlockedCat ? 'background:#E3F6EE;color:#075E43' : 'background:#FFF1D6;color:#7A4A00'),\n        afterText: canBook ? fmt(bal - sel.c) + ' pts' : fmt(bal) + ' pts',\n        bookDisabled: !canBook, bookOpacity: canBook ? 1 : 0.4,\n        bookLabel: canBook ? 'Book with ' + fmt(sel.c) + ' pts' : (unlockedCat ? fmt(sel.c - bal) + ' more points needed' : 'Unlocks at ' + fmt(cat.min) + ' pts'),\n        bookedTitle: s.booked.title, bookedCost: fmt(s.booked.cost) + ' pts', bookedRef: s.booked.ref\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
