<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lamplight Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--wall:#2b2128;--wall2:#412e33;--amber:#f2b45a;--glow:#ffd9a0;--ink:#f3e4cf;--dim:#b9a58f;--lab:#5f8f86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--wall);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;color:var(--ink);font-family:"Fraunces",Georgia,serif;font-variation-settings:"SOFT" 100;overflow-x:hidden;
background:radial-gradient(ellipse at 88% -10%,rgba(255,200,120,.30),transparent 55%),radial-gradient(ellipse at 5% 110%,rgba(196,119,107,.18),transparent 50%),linear-gradient(160deg,var(--wall2),var(--wall))}
.wall{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 46px)}
.glow{position:fixed;right:-10vmax;top:-12vmax;width:50vmax;height:50vmax;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,206,140,.32),transparent 65%);animation:breathe 7s ease-in-out infinite}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(10,5,8,.55))}
.grain{position:fixed;inset:-40px;pointer-events:none;opacity:.13;mix-blend-mode:overlay;animation:jit .9s steps(4) infinite;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.6'/></svg>")}
.mote{position:fixed;width:3px;height:3px;border-radius:50%;background:var(--glow);opacity:0;pointer-events:none;animation:drift linear infinite}
@keyframes breathe{50%{transform:scale(1.08);opacity:.78}}
@keyframes jit{25%{transform:translate(-14px,9px)}50%{transform:translate(10px,-12px)}75%{transform:translate(-6px,-4px)}}
@keyframes drift{0%{transform:translate(0,0);opacity:0}15%{opacity:.55}85%{opacity:.4}100%{transform:translate(40px,-120px);opacity:0}}
main{position:relative;display:grid;gap:1.6rem;max-width:1180px;margin:0 auto;padding:1.2rem;align-items:center;min-height:100svh}
@media(min-width:920px){main{grid-template-columns:1.3fr 1fr;gap:3rem}.mark{grid-column:1/-1}}
.mark{font-style:italic;font-weight:300;font-size:1.15rem;color:var(--dim);letter-spacing:.02em}
svg#deck{width:100%;height:auto;display:block;filter:drop-shadow(0 30px 40px rgba(0,0,0,.5))}
#arm{transform-origin:555px 95px;cursor:pointer;filter:drop-shadow(4px 6px 4px rgba(0,0,0,.45));transition:filter .6s}
#arm.lifted{filter:drop-shadow(14px 22px 10px rgba(0,0,0,.35))}
#rec{transform-origin:270px 250px;transition:opacity .6s,transform .6s}
#rec.swap{opacity:0;transform:scale(.94)}
#labc{fill:var(--lab);transition:fill .9s}
#led{fill:#4a2a1c;transition:fill .5s,filter .5s}#led.on{fill:#ff9a3c;filter:drop-shadow(0 0 6px #ff9a3c)}
.panel{display:grid;gap:1rem;align-content:center}
.side{margin:0;font-style:italic;color:var(--dim);font-size:1rem}
h1{margin:0;font-weight:300;font-style:italic;font-size:clamp(2.4rem,5.4vw,3.8rem);line-height:1.02;font-variation-settings:"SOFT" 100,"opsz" 144;transition:opacity .5s,transform .5s}
h1.out,.artist.out{opacity:0;transform:translateY(8px)}
.artist{margin:0;color:var(--dim);transition:opacity .5s .08s,transform .5s .08s}
.time{display:flex;align-items:center;gap:.8rem;font-size:.9rem;color:var(--dim);font-variant-numeric:tabular-nums}
.bar{flex:1;height:3px;background:rgba(243,228,207,.14);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber);box-shadow:0 0 10px var(--amber)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:1.2rem;margin:.3rem 0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
.play{position:relative;width:68px;height:68px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ffd596,var(--amber) 55%,#c98530);color:#3a2410;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.4),inset 0 -3px 6px rgba(120,60,10,.35);transition:transform .15s,box-shadow .15s}
.play:active{transform:scale(.93);box-shadow:0 2px 8px rgba(0,0,0,.4),inset 0 -1px 4px rgba(120,60,10,.35)}
.play::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--amber);opacity:0;pointer-events:none}
.play.on::after{animation:ring 2.8s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.7);opacity:0}}
.play svg{width:26px;height:26px;fill:currentColor}.play .pa{display:none}.play.on .pl{display:none}.play.on .pa{display:block}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:99px;background:rgba(0,0,0,.28);--i:0}
.seg span{position:absolute;left:3px;top:3px;bottom:3px;width:46px;border-radius:99px;background:rgba(242,180,90,.9);transform:translateX(calc(var(--i)*46px));transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.seg button{position:relative;width:46px;height:32px;background:none;border:0;border-radius:99px;transition:color .3s}
.seg button[aria-pressed=true]{color:#3a2410}
.sw{display:flex;align-items:center;gap:.6rem;background:none;border:0;padding:0;color:var(--dim)}
.sw i{width:38px;height:22px;border-radius:99px;background:rgba(0,0,0,.35);position:relative;transition:background .3s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.sw[aria-checked=true] i{background:rgba(242,180,90,.8)}.sw[aria-checked=true] i::after{transform:translateX(16px);background:#3a2410}
.knobw{display:flex;align-items:center;gap:.7rem;color:var(--dim)}
.knob{position:relative;width:58px;height:58px;border-radius:50%;touch-action:none;cursor:grab;background:conic-gradient(from 20deg,#6d6258,#2b2622,#8a7d70,#2b2622,#6d6258);box-shadow:0 5px 12px rgba(0,0,0,.5),inset 0 0 0 3px #1c1816}
.knob:active{cursor:grabbing}
.knob b{position:absolute;left:50%;top:5px;width:3px;height:16px;margin-left:-1.5px;border-radius:2px;background:var(--amber);transform-origin:50% 24px}
.knob u{position:absolute;left:50%;top:50%;width:2px;height:5px;margin:-2.5px -1px;background:rgba(243,228,207,.4);text-decoration:none}
.shelf{display:flex;gap:1rem;margin-top:.4rem}
.sl{background:none;border:0;padding:0;text-align:left;width:92px;color:var(--dim);font-size:.82rem;line-height:1.25}
.sl .cv{position:relative;display:block;width:92px;height:92px;border-radius:3px;margin-bottom:.5rem;box-shadow:0 8px 16px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.sl .cv::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#141114;transform:translateX(0);z-index:-1;transition:transform .4s cubic-bezier(.3,1.2,.5,1)}
.sl:hover .cv{transform:translateY(-5px) rotate(-2deg)}
.sl:hover:not([aria-pressed=true]) .cv::before{transform:translateX(24px)}
.sl[aria-pressed=true]{color:var(--glow)}.sl[aria-pressed=true] .cv{opacity:.55;transform:none}
.c1{background:repeating-linear-gradient(100deg,rgba(255,255,255,.09) 0 1px,transparent 1px 7px),linear-gradient(160deg,#3d6664,#1d3335)}
.c2{background:radial-gradient(circle at 50% 62%,#f6cf74 0 26%,transparent 27%),linear-gradient(#e8ad70,#b8674f)}
.c3{background:radial-gradient(circle at 70% 30%,#f3e4cf 0 9%,transparent 10%),linear-gradient(#3b2f55,#c4776b)}
.hint{margin:.4rem 0 0;font-style:italic;font-size:.92rem;color:var(--dim);min-height:1.4em}
@media(max-width:600px){.sl{width:80px}.sl .cv{width:80px;height:80px}}
@media(prefers-reduced-motion:reduce){.glow,.grain,.mote,.play.on::after{animation:none}}
</style></head>
<body>
<div class="wall"></div><div class="glow"></div><div class="vig"></div><div class="grain"></div>
<main>
<div class="mark">Lamplight Records</div>
<svg id="deck" viewBox="0 0 640 480" role="img" aria-label="A turntable with a spinning vinyl record and a tonearm">
<defs>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d553a"/><stop offset=".5" stop-color="#5e3d29"/><stop offset="1" stop-color="#3e2819"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8cdbd"/><stop offset=".5" stop-color="#8d8274"/><stop offset="1" stop-color="#c9bda9"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#ffe7c2" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<path id="lp" d="M270,250 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0"/>
</defs>
<rect x="14" y="14" width="612" height="452" rx="24" fill="url(#wood)"/>
<rect x="24" y="24" width="592" height="432" rx="18" fill="none" stroke="rgba(255,220,170,.18)" stroke-width="1.5"/>
<g fill="#2a1a10"><circle cx="46" cy="46" r="4"/><circle cx="594" cy="46" r="4"/><circle cx="46" cy="434" r="4"/><circle cx="594" cy="434" r="4"/></g>
<circle id="led" cx="82" cy="432" r="4.5"/>
<circle cx="270" cy="250" r="204" fill="#2a1a10" opacity=".6"/>
<circle cx="270" cy="250" r="198" fill="url(#metal)"/>
<g id="spin"><g id="strobe" fill="#2b2622"></g>
<g id="rec"><circle cx="270" cy="250" r="184" fill="#121014"/><g id="grooves" fill="none"></g>
<circle id="labc" cx="270" cy="250" r="62"/><circle cx="270" cy="250" r="62" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="2"/>
<circle cx="270" cy="250" r="30" fill="none" stroke="rgba(0,0,0,.18)"/>
<text font-size="8.5" letter-spacing="2.4" fill="#2a1a10" font-family="Fraunces,Georgia,serif" font-style="italic"><textPath href="#lp" id="lt"></textPath></text></g>
<circle cx="270" cy="250" r="5" fill="url(#metal)"/></g>
<path d="M270,250 L130,95 A210,210 0 0 1 410,95 Z" fill="url(#sheen)" opacity=".9" pointer-events="none"/>
<path d="M270,250 L130,405 A210,210 0 0 0 410,405 Z" fill="url(#sheen)" opacity=".55" pointer-events="none"/>
<circle cx="555" cy="95" r="34" fill="#2a1a10" opacity=".55"/><circle cx="555" cy="95" r="30" fill="url(#metal)"/><circle cx="555" cy="95" r="13" fill="#3b342e"/>
<g id="arm" style="transform:rotate(100deg)">
<rect x="-62" y="-11" width="34" height="22" rx="5" fill="#3b342e"/>
<rect x="-30" y="-3.5" width="334" height="7" rx="3.5" fill="url(#metal)"/>
<rect x="282" y="-9" width="34" height="17" rx="3" fill="#1d1916"/><rect x="306" y="-14" width="16" height="4" rx="2" fill="#8d8274"/>
<circle cx="300" cy="0" r="2.6" fill="#f2b45a"/></g>
</svg>
<section class="panel">
<p class="side" id="side">Side A</p>
<h1 id="title">Rainy Window</h1>
<p class="artist" id="artist">Hazel Moth Quartet</p>
<div class="time"><span id="t">0:00</span><div class="bar"><i id="bar"></i></div><span>1:36</span></div>
<div class="controls">
<button class="play" id="play" aria-label="Play"><svg class="pl" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="pa" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
<div class="seg" id="seg" role="group" aria-label="Speed"><span></span><button data-r="33" aria-pressed="true">33</button><button data-r="45" aria-pressed="false">45</button></div>
<button class="sw" id="crk" role="switch" aria-checked="true"><i></i>Crackle</button>
<div class="knobw"><div class="knob" id="knob" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70"><b></b></div>Volume</div>
</div>
<div class="shelf" id="shelf"></div>
<p class="hint" id="hint">Press play, or tap the tonearm to lower the needle.</p>
</section>
</main>
<script>
const $=s=>document.querySelector(s),NS="http://www.w3.org/2000/svg";
const T=[
{n:"Rainy Window",a:"Hazel Moth Quartet",lab:"#5f8f86",bpm:58,c:"c1",pool:[64,67,69,72,74,76,79],ch:[[45,[12,15,19,22,26]],[41,[12,16,19,23]],[48,[7,11,14,16]],[40,[12,15,19,22]]]},
{n:"Slow Sunday",a:"The Marmalade Trio",lab:"#d6a43c",bpm:70,c:"c2",pool:[67,69,72,74,76,79,81],ch:[[36,[24,28,31,35]],[33,[24,27,31,34]],[41,[12,16,19,23]],[43,[12,16,19,21]]]},
{n:"Last Light",a:"Ines and the Evening Birds",lab:"#c4776b",bpm:52,c:"c3",pool:[62,65,67,69,72,74,77],ch:[[38,[12,15,19,22,26]],[34,[12,16,19,23]],[43,[12,15,19,22]],[45,[12,16,19,22]]]}];
const SIDE=96,A0=119.8,A1=139.1,REST=100;
const S={phase:"idle",tr:0,rate:1,vol:.7,crk:true,ang:0,sp:0,spinOn:false,prog:0,armA:REST};
/* build grooves + strobe dots */
const gr=$("#grooves");for(let r=68;r<=180;r+=2.6){const c=document.createElementNS(NS,"circle");c.setAttribute("cx",270);c.setAttribute("cy",250);c.setAttribute("r",r);c.setAttribute("stroke","rgba(255,255,255,"+(.025+Math.random()*.06).toFixed(3)+")");gr.appendChild(c)}
[118,152].forEach(r=>{const c=document.createElementNS(NS,"circle");c.setAttribute("cx",270);c.setAttribute("cy",250);c.setAttribute("r",r);c.setAttribute("stroke","rgba(0,0,0,.7)");c.setAttribute("stroke-width",3);gr.appendChild(c)});
for(let i=0;i<60;i++){const a=i/60*Math.PI*2,d=document.createElementNS(NS,"circle");d.setAttribute("cx",270+Math.cos(a)*191);d.setAttribute("cy",250+Math.sin(a)*191);d.setAttribute("r",i%5?1.1:2);$("#strobe").appendChild(d)}
/* shelf */
T.forEach((t,i)=>{const b=document.createElement("button");b.className="sl";b.setAttribute("aria-pressed",i==0);b.innerHTML=`<span class="cv ${t.c}"></span>${t.n}`;b.onclick=()=>pick(i);$("#shelf").appendChild(b)});
/* dust motes */
for(let i=0;i<16;i++){const m=document.createElement("span");m.className="mote";m.style.cssText=`left:${55+Math.random()*45}vw;top:${10+Math.random()*80}vh;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*14}s`;document.body.appendChild(m)}
/* audio */
let C,mast,tone,conv,w1,w2,crkG,sess,timer,nextT=0,bar=0,mel=3;
function lfo(f,d){const o=C.createOscillator(),g=C.createGain();o.frequency.value=f;g.gain.value=d;o.connect(g);o.start();return g}
function vol(){if(C)mast.gain.setTargetAtTime(S.vol*S.vol*.9,C.currentTime,.05)}
function initAudio(){if(C){if(C.state!=="running")C.resume();return}
C=new(window.AudioContext||window.webkitAudioContext)();
mast=C.createGain();tone=C.createBiquadFilter();tone.type="lowpass";tone.frequency.value=2600;tone.connect(mast);mast.connect(C.destination);vol();
const L=C.sampleRate*2.4|0,ib=C.createBuffer(2,L,C.sampleRate);for(let k=0;k<2;k++){const d=ib.getChannelData(k);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,3)}
conv=C.createConvolver();conv.buffer=ib;const rv=C.createGain();rv.gain.value=.5;conv.connect(rv);rv.connect(tone);
w1=lfo(.55,9);w2=lfo(6.3,3);
const n=C.sampleRate*3,cb=C.createBuffer(1,n,C.sampleRate),d=cb.getChannelData(0);
for(let i=0;i<n;i++){d[i]+=(Math.random()-.5)*.014;if(Math.random()<7/C.sampleRate*3){const a=(Math.random()-.4)*(Math.random()>.9?.9:.35);for(let k=0;k<40&&i+k<n;k++)d[i+k]+=a*Math.exp(-k/6)}}
const cs=C.createBufferSource();cs.buffer=cb;cs.loop=true;const hp=C.createBiquadFilter();hp.type="highpass";hp.frequency.value=900;crkG=C.createGain();crkG.gain.value=0;cs.connect(hp);hp.connect(crkG);crkG.connect(mast);cs.start()}
function note(f,t,dur,type,g,att,rel){const o=C.createOscillator(),e=C.createGain();o.type=type;o.frequency.value=f;w1.connect(o.detune);w2.connect(o.detune);
e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+att);e.gain.setTargetAtTime(0,t+dur,rel/3);o.connect(e);e.connect(sess);o.start(t);o.stop(t+dur+rel*1.3);o.onended=()=>{w1.disconnect(o.detune);w2.disconnect(o.detune)}}
function sched(t){const k=T[S.tr],beat=60/k.bpm/S.rate,c=k.ch[bar%4],f=m=>440*Math.pow(2,(m-69)/12)*S.rate;
c[1].forEach((o,i)=>note(f(c[0]+o),t+i*.05,beat*4.2,"triangle",.05,.5,1.8));
note(f(c[0]),t,beat*2,"sine",.16,.05,.8);note(f(c[0]),t+beat*2.5,beat*1.2,"sine",.11,.05,.6);
for(let b=0;b<8;b++)if(Math.random()<(b%2?.2:.4)){mel=Math.max(0,Math.min(6,mel+Math.floor(Math.random()*5)-2));const fr=f(k.pool[mel]+(Math.random()<.15?12:0)),tt=t+b*beat/2+Math.random()*.02;note(fr,tt,beat*1.4,"sine",.07,.01,1.4);note(fr*2,tt,beat*.5,"sine",.02,.01,.6)}
bar++}
function tick(){const k=T[S.tr];while(nextT<C.currentTime+1.4){sched(nextT);nextT+=4*60/k.bpm/S.rate}}
function thump(){const t=C.currentTime,o=C.createOscillator(),g=C.createGain();o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(38,t+.2);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(mast);o.start(t);o.stop(t+.35)}
function startMusic(){sess=C.createGain();sess.gain.value=0;sess.gain.setTargetAtTime(1,C.currentTime,.05);sess.connect(tone);const s=C.createGain();s.gain.value=.8;sess.connect(s);s.connect(conv);
nextT=C.currentTime+.2;tick();timer=setInterval(tick,250);crkG.gain.setTargetAtTime(S.crk?.35:0,C.currentTime,.05)}
function stopMusic(){clearInterval(timer);if(sess){const s=sess;s.gain.setTargetAtTime(0,C.currentTime,.12);setTimeout(()=>s.disconnect(),2500)}if(C)crkG.gain.setTargetAtTime(0,C.currentTime+.1,.15)}
/* transport */
const arm=$("#arm"),play=$("#play"),hint=$("#hint");
function ui(){const on=S.phase!=="idle";play.classList.toggle("on",on);play.setAttribute("aria-label",on?"Pause":"Play");$("#led").classList.toggle("on",on)}
function start(){initAudio();S.phase="dropping";S.spinOn=true;arm.classList.add("lifted");hint.textContent="Turn the knob to set the volume. Press space to lift the needle.";ui()}
function stop(msg){if(S.phase==="idle")return;S.phase="idle";S.spinOn=false;arm.classList.add("lifted");stopMusic();if(C)thump();if(msg)hint.textContent=msg;else hint.textContent="Needle lifted. Press play to drop it where you left off.";ui()}
function toggle(){S.phase==="idle"?start():stop()}
function land(){S.phase="playing";arm.classList.remove("lifted");thump();startMusic()}
function pick(i){if(i===S.tr)return;const was=S.phase!=="idle";if(was)stop();S.tr=i;S.prog=0;bar=0;
$("#rec").classList.add("swap");$("#title").classList.add("out");$("#artist").classList.add("out");
document.querySelectorAll(".sl").forEach((b,j)=>b.setAttribute("aria-pressed",j===i));
setTimeout(()=>{const t=T[i];document.documentElement.style.setProperty("--lab",t.lab);$("#title").textContent=t.n;$("#artist").textContent=t.a;lab();$("#rec").classList.remove("swap");$("#title").classList.remove("out");$("#artist").classList.remove("out")},700);
hint.textContent="A new record is on the platter.";if(was)setTimeout(start,2600)}
function lab(){$("#lt").textContent=`${T[S.tr].n} · Side A · ${S.rate>1?"45":"33⅓"} rpm · `}
lab();
/* frame loop */
let last=performance.now(),shown=-1;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
const tgt=S.spinOn?(S.rate>1?270:200)*.75:0;S.sp+=(tgt-S.sp)*(1-Math.exp(-dt*(S.spinOn?.9:1.5)));
S.ang=(S.ang+S.sp*dt)%360;$("#spin").setAttribute("transform",`rotate(${S.ang.toFixed(2)} 270 250)`);
if(S.phase==="playing"){S.prog+=dt*S.rate;if(S.prog>=SIDE){S.prog=0;stop("End of the side. Pick another record from the shelf.")}}
const tg=S.phase==="idle"?REST:A0+(A1-A0)*S.prog/SIDE;
S.armA+=(tg-S.armA)*(1-Math.exp(-dt*(S.phase==="playing"?8:3.2)));arm.style.transform=`rotate(${S.armA.toFixed(2)}deg)`;
if(S.phase==="dropping"&&Math.abs(S.armA-tg)<.5)land();
const s=S.prog|0;if(s!==shown){shown=s;$("#t").textContent=(s/60|0)+":"+String(s%60).padStart(2,"0")}
$("#bar").style.width=(S.prog/SIDE*100)+"%";requestAnimationFrame(frame)}
requestAnimationFrame(frame);
/* controls */
play.onclick=toggle;arm.onclick=toggle;
addEventListener("keydown",e=>{if(e.code==="Space"&&!/BUTTON/.test(document.activeElement.tagName)&&document.activeElement.id!=="knob"){e.preventDefault();toggle()}if(["Digit1","Digit2","Digit3"].includes(e.code))pick(+e.key-1)});
const seg=$("#seg");seg.querySelectorAll("button").forEach((b,i)=>b.onclick=()=>{S.rate=b.dataset.r==="45"?1.364:1;seg.style.setProperty("--i",i);seg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));lab()});
const crk=$("#crk");crk.onclick=()=>{S.crk=!S.crk;crk.setAttribute("aria-checked",S.crk);if(C&&S.phase==="playing")crkG.gain.setTargetAtTime(S.crk?.35:0,C.currentTime,.05)};
const knob=$("#knob");for(let i=0;i<=10;i++){const u=document.createElement("u");u.style.transform=`rotate(${-135+i*27}deg) translateY(-38px)`;knob.appendChild(u)}
function setVol(v){S.vol=Math.max(0,Math.min(1,v));knob.querySelector("b").style.transform=`rotate(${-135+S.vol*270}deg)`;knob.setAttribute("aria-valuenow",Math.round(S.vol*100));vol()}
setVol(.7);let dragY=null;
knob.onpointerdown=e=>{dragY=e.clientY;knob.setPointerCapture(e.pointerId)};
knob.onpointermove=e=>{if(dragY!==null){setVol(S.vol+(dragY-e.clientY)/160);dragY=e.clientY}};
knob.onpointerup=()=>dragY=null;
knob.onwheel=e=>{e.preventDefault();setVol(S.vol-e.deltaY/800)};
knob.onkeydown=e=>{if(e.key==="ArrowUp"||e.key==="ArrowRight")setVol(S.vol+.05);if(e.key==="ArrowDown"||e.key==="ArrowLeft")setVol(S.vol-.05)};
</script></body></html>
