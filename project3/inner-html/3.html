<style>
/* Layout: sticky tab strip over a single working canvas. Every sheet starts blank so nothing reads as collected evidence. */
:root{
  --bg:#F5F6F8;--surface:#FFFFFF;--surface-2:#ECEFF4;--line:#D8DEE8;
  --ink:#141A2A;--ink-2:#465067;--muted:#677289;
  --accent:#2447C8;--accent-soft:#E3E9FB;--on-accent:#FFFFFF;
  --good:#146C43;--good-bg:#E1F3E8;--warn:#8F5600;--warn-bg:#FFF0D2;--crit:#B3261E;--crit-bg:#FDE6E3;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1220;--surface:#161D2F;--surface-2:#1E273C;--line:#2A354E;--ink:#E9EDF6;--ink-2:#B0B9CC;--muted:#8E99B0;
  --accent:#8AA6FF;--accent-soft:#1F2B53;--on-accent:#0E1220;--good:#63D493;--good-bg:#12301F;--warn:#F2BC55;--warn-bg:#3A2A0C;--crit:#FF8D80;--crit-bg:#451A1A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1220;--surface:#161D2F;--surface-2:#1E273C;--line:#2A354E;--ink:#E9EDF6;--ink-2:#B0B9CC;--muted:#8E99B0;
  --accent:#8AA6FF;--accent-soft:#1F2B53;--on-accent:#0E1220;--good:#63D493;--good-bg:#12301F;--warn:#F2BC55;--warn-bg:#3A2A0C;--crit:#FF8D80;--crit-bg:#451A1A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
header.h{padding:20px 0 10px}
h1{font-size:23px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 8px;font-weight:600}h3{font-size:14px;margin:0 0 6px;font-weight:600}
.sub{color:var(--ink-2);max-width:78ch;margin:0}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:8px 0 18px;padding-top:4px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs button{border:0;background:none;padding:9px 13px;color:var(--ink-2);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.note{background:var(--accent-soft);border-radius:8px;padding:9px 12px;margin-bottom:14px;color:var(--ink);font-size:13px}
.note.warn{background:var(--warn-bg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500}.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.del{color:var(--crit)}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:6px 8px;width:100%}
textarea{resize:vertical;min-height:54px}
label.l{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin:0 0 3px}
.f{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:500;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.crit{background:var(--crit-bg);color:var(--crit)}.chip.info{background:var(--accent-soft);color:var(--accent)}
.mono{font-family:var(--mono);font-size:12.5px}
.prog{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}
.chk{display:flex;gap:9px;align-items:flex-start;padding:5px 0}.chk input{margin-top:3px;width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:3px 9px;font-size:12.5px;color:var(--ink-2)}.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:8px}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:500}
details ol,details ul{margin:6px 0 4px;padding-left:20px;color:var(--ink-2)}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{background:var(--surface-2);border-radius:10px;min-width:210px;width:210px;padding:8px;flex:none}
.col.over{outline:2px dashed var(--accent)}
.col input.t{font-weight:600;background:transparent;border:0;padding:3px 4px;width:100%}
.stk{background:var(--surface);border:1px solid var(--line);border-left-width:4px;border-radius:7px;padding:7px 9px;margin:6px 0;font-size:13px;cursor:grab}
.stk small{display:block;color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:3px}
.stk select{margin-top:5px;padding:2px 4px;font-size:12px}
.ev-Observed{border-left-color:var(--good)}.ev-Reported{border-left-color:var(--accent)}.ev-Inferred{border-left-color:var(--warn)}.ev-Unverified{border-left-color:var(--crit)}
.map{min-width:1100px}.map td{min-width:116px;padding:4px}.map textarea{min-height:64px;font-size:12.5px}
.map td.fl textarea{background:var(--warn-bg);border-color:var(--warn)}
.cell{position:relative}.cell button.flag{position:absolute;right:6px;top:6px;border:0;background:var(--surface);border-radius:5px;font-size:12px;padding:0 4px;opacity:.85}
.heat td.s{text-align:center;font-family:var(--mono);font-size:13px;width:90px}
.sc button{min-width:30px}
.tip{color:var(--muted);font-size:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
<div class="wrap">
<header class="h"><h1>OpsPilot Research Workbook</h1><p class="sub">Working sheets for Project 04. Everything here starts empty and saves in this browser. It tracks research you have yet to do, so nothing on these sheets counts as evidence until you enter it.</p></header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Workbook sections"></nav>
<div id="view"></div>
</div>
<script>
(function(){
'use strict';
var KEY='opspilot-workbook-v1',DB={};
function load(){try{DB=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){DB={};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function get(p,d){var o=DB;for(var i=0;i<p.length;i++){if(o==null||typeof o!=='object')return d;o=o[p[i]];}return o==null?d:o;}
function set(p,v){var o=DB;for(var i=0;i<p.length-1;i++){if(o[p[i]]==null||typeof o[p[i]]!=='object')o[p[i]]={};o=o[p[i]];}o[p[p.length-1]]=v;save();}
function arr(k){if(!Array.isArray(DB[k]))DB[k]=[];return DB[k];}
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
function bind(p,tag,extra){return 'data-b="'+p.join('|')+'"'+(extra||'');}
function ta(p,ph,rows){return '<textarea '+bind(p)+' rows="'+(rows||2)+'" placeholder="'+esc(ph||'')+'">'+esc(get(p,''))+'</textarea>';}
function tx(p,ph){return '<input type="text" '+bind(p)+' placeholder="'+esc(ph||'')+'" value="'+esc(get(p,''))+'">';}
function sel(p,opts,ph){var v=get(p,'');return '<select '+bind(p)+' data-rr="1">'+(ph?'<option value="">'+ph+'</option>':'')+opts.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';}
function uid(){return Math.random().toString(36).slice(2,8);}
function pid(n){return 'P'+(n<10?'0':'')+n;}

var TAB='plan';
var TABS=[['plan','Plan & progress'],['recruit','Recruitment'],['notes','Interviews'],['aff','Affinity map'],['wf','Workflow map'],['jm','Journey map'],['comp','Competitor audit'],['strat','Strategy'],['val','Usability'],['meas','Measurement']];

/* ===== Plan ===== */
var CHECK=[['Research',['Research objectives and hypotheses','Participant recruitment screener','Consent and participant information','Interview guide','Interview notes and anonymised evidence','Competitor audit']],['Synthesis',['Affinity map','Current-state workflow map','User journey map','Validated problem statement']],['Strategy',['Opportunity prioritisation','Jobs to be done','MVP feature prioritisation']],['Product',['Product requirements document','Information architecture','Core user flows']],['Design',['Low-fidelity wireframes','High-fidelity prototype','Design system and component states']],['Validation',['Usability test plan','Test observations and iterations']],['Delivery',['Product measurement plan']],['Portfolio',['Final case study narrative']]];
var HOME={'Research objectives and hypotheses':'Here, below','Participant recruitment screener':'Recruitment tab','Consent and participant information':'Recruitment tab','Interview guide':'Interviews tab','Interview notes and anonymised evidence':'Interviews tab','Competitor audit':'Competitor audit tab','Affinity map':'Affinity map tab','Current-state workflow map':'Workflow map tab','User journey map':'Journey map tab','Opportunity prioritisation':'Strategy tab','Jobs to be done':'Strategy tab','MVP feature prioritisation':'Strategy tab','Usability test plan':'Usability tab','Test observations and iterations':'Usability tab','Product measurement plan':'Measurement tab'};
var RO=[['RO1','Understand existing workflows','How support performance is monitored'],['RO2','Identify operational friction','Where delays, workarounds and handoffs occur'],['RO3','Understand decision-making','How issues are prioritised'],['RO4','Understand information needs','What context is needed to investigate'],['RO5','Understand collaboration','How responsibility and follow-up work'],['RO6','Evaluate the hypothesis','Whether a connected issue-to-resolution workflow is valuable']];
var HYP=[['H1','Performance information is fragmented','Participants regularly switch between tools to investigate issues','Existing systems already provide sufficient context'],['H2','Identifying an issue is easier than resolving it','Participants describe manual handoffs after detecting a problem','Existing workflows connect detection and resolution effectively'],['H3','Prioritisation is inconsistent','Teams use informal judgement or conflicting criteria','Teams have clear, trusted prioritisation processes'],['H4','Ownership is difficult to track','Follow-ups rely on messages, spreadsheets or manual checks','Ownership and progress are visible in existing tools'],['H5','Managers need more actionable reporting','Metrics are available but do not answer operational questions','Current reporting already supports decisions effectively']];
var HST=['Untested','Supported','Challenged','Mixed'];
function vPlan(){
  var total=0,done=0,h='<div class="note warn">This checklist tracks preparation and completion of deliverables. It does not track findings. Mark a research deliverable complete when the real work exists.</div><div class="cols"><div class="card"><h2>Deliverables</h2>';
  CHECK.forEach(function(g){g[1].forEach(function(n){total++;if(get(['chk',n],false))done++;});});
  h+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px"><div class="prog" style="flex:1"><i style="width:'+Math.round(done/total*100)+'%"></i></div><b class="mono">'+Math.round(done/total*100)+'%</b></div><div class="tip" style="margin-bottom:8px">'+done+' of '+total+' deliverables marked complete</div>';
  CHECK.forEach(function(g){h+='<h3 style="margin-top:12px">'+g[0]+'</h3>';g[1].forEach(function(n){h+='<label class="chk"><input type="checkbox" data-chk="'+esc(n)+'"'+(get(['chk',n],false)?' checked':'')+'><span>'+n+(HOME[n]?' <span class="chip">'+HOME[n]+'</span>':'')+'</span></label>';});});
  h+='</div><div>';
  var cnt={Supported:0,Challenged:0,Mixed:0,Untested:0};HYP.forEach(function(x){cnt[get(['hyp',x[0],'s'],'Untested')]++;});
  h+='<div class="card"><h2>Central hypothesis</h2><p style="margin:0 0 8px;color:var(--ink-2)">Customer support operations teams struggle to move from identifying a performance issue to understanding its cause, assigning corrective action and tracking its resolution because the relevant information and workflows are fragmented.</p><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip">Untested '+cnt.Untested+'</span><span class="chip good">Supported '+cnt.Supported+'</span><span class="chip warn">Mixed '+cnt.Mixed+'</span><span class="chip crit">Challenged '+cnt.Challenged+'</span></div><p class="tip" style="margin:8px 0 0">Decision rule: do not force the product concept to survive. If research disproves the main hypothesis, change the product direction.</p></div>';
  h+='<div class="card"><h2>Research objectives</h2><div class="tw"><table><thead><tr><th>ID</th><th>Objective</th><th>What we need to learn</th></tr></thead><tbody>'+RO.map(function(r){return '<tr><td class="mono">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>';}).join('')+'</tbody></table></div></div></div></div>';
  h+='<div class="card"><h2>Hypotheses to test</h2><p class="tip" style="margin-top:-4px">Set a status only after interviews give you evidence. Record which participants support or challenge each one.</p>'+HYP.map(function(x){var st=get(['hyp',x[0],'s'],'Untested');
    return '<div style="border-top:1px solid var(--line);padding:12px 0"><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center"><h3 style="margin:0">'+x[0]+': '+x[1]+'</h3><div class="seg" role="group" aria-label="'+x[0]+' status">'+HST.map(function(s){return '<button data-hs="'+x[0]+'|'+s+'" aria-pressed="'+(st===s)+'">'+s+'</button>';}).join('')+'</div></div><div class="grid3" style="margin-top:8px"><div><span class="l" style="font-size:12px;color:var(--good)">Supported if</span><div class="tip" style="color:var(--ink-2)">'+x[2]+'</div></div><div><span class="l" style="font-size:12px;color:var(--crit)">Challenged if</span><div class="tip" style="color:var(--ink-2)">'+x[3]+'</div></div><div><label class="l">Evidence log (participant IDs, what you saw)</label>'+ta(['hyp',x[0],'e'],'e.g. P03 observed switching between 3 tools',2)+'</div></div></div>';}).join('')+'</div>';
  return h;
}

/* ===== Recruitment ===== */
var PT=['Customer support operations manager','Support team lead / supervisor','Customer experience / service delivery manager','Workforce management / quality lead'],PTG=[3,3,2,2];
var SROLE=['Operations Manager','Customer Support Manager','Team Lead / Supervisor','Customer Experience Manager','Workforce Management / Quality Lead','Customer Support Agent','Other'];
var SYRS=['Less than 1 year','1–2 years','2–5 years','5–8 years','8+ years'];
var SRESP=['Monitoring team performance','Investigating support issues','Managing SLAs or response targets','Allocating agent workload','Assigning or tracking corrective actions','Preparing performance reports','Handling individual customer queries only'];
var SCH=['Email','Live chat','Phone','Social media','WhatsApp / messaging','Other'];
var STOOL=['Ticketing / helpdesk software','Spreadsheets','Analytics / reporting dashboards','Project or task management software','Messaging / collaboration tools','Custom internal tools','None of these'];
var SSZ=['1–10','11–50','51–100','101–500','500+'],SINV=['Yes, within the last month','Yes, within the last three months','No','Not part of my role'];
function verdict(){
  var r=get(['scr','role'],''),y=get(['scr','yrs'],''),inv=get(['scr','inv'],''),resp=get(['scr','resp'],{}),why=[];
  if(!r)return null;
  var only=!!resp[SRESP[6]],ops=!!(resp[SRESP[0]]||resp[SRESP[1]]||resp[SRESP[4]]||resp[SRESP[5]]);
  var exp=y==='2–5 years'||y==='5–8 years'||y==='8+ years',recent=inv===SINV[0]||inv===SINV[1],lead=r==='Operations Manager'||r==='Customer Support Manager'||r==='Team Lead / Supervisor',cxq=r==='Customer Experience Manager'||r==='Workforce Management / Quality Lead';
  if(r==='Customer Support Agent'&&!ops)return{v:'Not a fit',c:'crit',why:['Agent role with no reporting, investigation or workflow responsibility.']};
  if(only&&!ops)return{v:'Not a fit',c:'crit',why:['Only handles individual customer queries.']};
  if(inv===SINV[3])return{v:'Not a fit',c:'crit',why:['Issue investigation is not part of the role.']};
  if(lead&&exp&&ops&&recent)return{v:'Strong fit',c:'good',why:['Manager or team lead with 2+ years, operational responsibility and a recent incident.']};
  if(!exp)why.push('Under 2 years of experience.');if(!recent)why.push('No investigation in the last three months.');if(!ops)why.push('No monitoring, investigation or reporting responsibility selected.');
  if(lead&&why.length)return{v:'Possible fit',c:'warn',why:why};
  if(cxq&&resp[SRESP[1]])return{v:'Possible fit',c:'warn',why:['CX or quality professional who investigates issues but may not own the whole workflow.'].concat(why)};
  return{v:'Not a fit',c:'crit',why:why.length?why:['Role does not match the target profile.']};
}
function vRec(){
  var P=arr('part'),h='<div class="cols"><div class="card"><h2>Sample tracker</h2><p class="tip" style="margin-top:-4px">Targets are goals, not recruited participants. Add a row only for a real person, using an anonymised ID.</p>';
  h+=PT.map(function(t,i){var n=P.filter(function(p){return p.type===t;}).length;return '<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>'+t+'</span><b class="mono">'+n+' / '+PTG[i]+'</b></div><div class="prog"><i style="width:'+Math.min(100,n/PTG[i]*100)+'%"></i></div></div>';}).join('');
  h+='<div class="mono" style="margin:8px 0">Total '+P.length+' / 10</div>';
  var cnt=function(k){var o={};P.forEach(function(p){if(p[k])o[p[k]]=(o[p[k]]||0)+1;});return Object.keys(o).map(function(x){return '<span class="chip">'+esc(x)+' '+o[x]+'</span>';}).join(' ')||'<span class="tip">none yet</span>';};
  h+='<div class="tip" style="margin-top:8px">Diversity check</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0">'+cnt('size')+'</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0">'+cnt('maturity')+'</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0">'+cnt('source')+'</div>';
  var co={};P.forEach(function(p){if(p.company)co[p.company]=(co[p.company]||0)+1;});var dup=Object.keys(co).filter(function(c){return co[c]>=3;});
  if(dup.length)h+='<div class="note warn" style="margin-top:8px">3 or more participants from the same organisation. Aim for a mix of companies.</div>';
  h+='<h3 style="margin-top:14px">Add participant</h3><div class="grid2"><div class="f"><label class="l">Participant type</label><select id="np-type">'+PT.map(function(t){return '<option>'+t+'</option>';}).join('')+'</select></div><div class="f"><label class="l">Team size</label><select id="np-size">'+SSZ.map(function(t){return '<option>'+t+'</option>';}).join('')+'</select></div><div class="f"><label class="l">Tool maturity</label><select id="np-mat"><option>Spreadsheet-led</option><option>Mixed tools</option><option>Dedicated helpdesk + analytics</option></select></div><div class="f"><label class="l">Recruited via</label><select id="np-src"><option>LinkedIn</option><option>CX community</option><option>Operations group</option><option>Referral</option><option>Other</option></select></div></div><div class="f"><label class="l">Organisation (private, for the diversity check only)</label><input type="text" id="np-co" placeholder="Company name or code"></div><button class="btn pri" data-act="addpart">Add '+pid(P.length+1)+'</button>';
  if(P.length)h+='<div class="tw" style="margin-top:12px"><table><thead><tr><th>ID</th><th>Type</th><th>Status</th><th></th></tr></thead><tbody>'+P.map(function(p,i){return '<tr><td class="mono">'+p.id+'</td><td>'+esc(p.type)+'</td><td><select data-ps="'+i+'">'+['Screened','Scheduled','Interviewed','Dropped'].map(function(s){return '<option'+(p.status===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></td><td><button class="btn sm del" data-act="delpart" data-i="'+i+'">Remove</button></td></tr>';}).join('')+'</tbody></table></div>';
  h+='</div><div><div class="card"><h2>Screener check</h2><p class="tip" style="margin-top:-4px">Answer on behalf of a candidate to see the fit rating. This is a template, so collect contact details separately and only with consent.</p>';
  h+='<div class="f"><label class="l">1. Current role</label>'+sel(['scr','role'],SROLE,'Select')+'</div><div class="f"><label class="l">2. Time in customer support or operations</label>'+sel(['scr','yrs'],SYRS,'Select')+'</div>';

  h+=O.map(function(o,i){return '<div style="border-top:1px solid var(--line);padding:10px 0"><div style="display:flex;gap:6px;margin-bottom:6px"><input type="text" data-on="'+i+'" value="'+esc(o.n)+'" aria-label="Opportunity name" style="font-weight:600"><button class="btn sm del" data-act="delopp" data-i="'+i+'">✕</button></div><div class="grid2">'+[['sev','Severity of the problem'],['freq','How often it occurs'],['eff','Build effort'],['ppl','Participants affected']].map(function(f){return '<div><label class="l">'+f[1]+': <b class="mono">'+(o[f[0]]||'not set')+'</b></label><input type="range" min="0" max="5" step="1" value="'+o[f[0]]+'" data-os="'+i+'|'+f[0]+'" aria-label="'+f[1]+'"></div>';}).join('')+'</div></div>';}).join('')+'<button class="btn sm" data-act="addopp">Add area</button></div><div class="card"><h2>Impact against effort</h2>';

  h+='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Opportunities by impact and effort"><rect x="'+m+'" y="10" width="'+(W-m-10)+'" height="'+(H-m-10)+'" fill="none" stroke="var(--line)"/><line x1="'+(m+(W-m-10)/2)+'" x2="'+(m+(W-m-10)/2)+'" y1="10" y2="'+(H-m)+'" stroke="var(--line)" stroke-dasharray="4 4"/><line x1="'+m+'" x2="'+(W-10)+'" y1="'+(10+(H-m-10)/2)+'" y2="'+(10+(H-m-10)/2)+'" stroke="var(--line)" stroke-dasharray="4 4"/><text x="'+(m+(W-m)/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="12" fill="var(--ink-2)">Build effort →</text><text transform="translate(14 '+(H/2)+') rotate(-90)" text-anchor="middle" font-size="12" fill="var(--ink-2)">Impact (severity × frequency) →</text><text x="'+(m+6)+'" y="26" font-size="11" fill="var(--good)">Quick wins</text><text x="'+(W-14)+'" y="26" font-size="11" fill="var(--ink-2)" text-anchor="end">Big bets</text>';
  pl.forEach(function(o){var ex=m+(o.eff-1)/4*(W-m-40)+15,im=o.sev*o.freq/5,ey=H-m-10-(im-.2)/4.8*(H-m-30);h+='<circle cx="'+ex+'" cy="'+ey+'" r="'+(6+o.ppl*1.6)+'" fill="var(--accent)" opacity=".7" stroke="var(--surface)" stroke-width="2"/><text x="'+ex+'" y="'+(ey-12-o.ppl)+'" text-anchor="middle" font-size="11" fill="var(--ink)">'+esc(o.n)+'</text>';});
  h+='</svg>'+(pl.length?'':'<div class="empty">Score severity, frequency and effort on at least one area to plot it. Bubble size is participants affected.</div>')+'</div></div>';
  h+='<div class="card"><h2>Jobs to be done</h2><p class="tip" style="margin-top:-4px">Starting statements from the product definition. Rewrite them in the participants\' language after synthesis.</p><div class="grid3">'+JTBD.map(function(j,i){return '<div><label class="l">'+j[0]+'</label><textarea '+bind(['jtbd',i])+' rows="4">'+esc(get(['jtbd',i],j[1]))+'</textarea></div>';}).join('')+'</div></div>';
  h+='<div class="card"><h2>MVP feature prioritisation</h2><p class="tip" style="margin-top:-4px">Starting priorities from the requirements baseline. After interviews, record whether research supports each one and change the priority if it does not. A feature is not P0 because it looks impressive.</p><div class="tw"><table><thead><tr><th>ID</th><th>Feature</th><th>Baseline</th><th>Research says</th><th>Revised priority</th></tr></thead><tbody>'+FR.map(function(f){return '<tr><td class="mono">'+f[0]+'</td><td>'+f[1]+'</td><td><span class="chip'+(f[2]==='P0'?' info':'')+'">'+f[2]+'</span></td><td>'+sel(['fr',f[0],'r'],['Not tested','Supported','Challenged','Not raised'])+'</td><td>'+sel(['fr',f[0],'p'],['P0','P1','P2','Drop'],f[2]+' (unchanged)')+'</td></tr>';}).join('')+'</tbody></table></div></div>';
  return h;
}

/* ===== Usability ===== */
var SCEN=[['Identify a performance problem','You are reviewing your support operation for the week. Identify which area requires the most attention and explain why.',['Can the participant find the relevant metric?','Do they understand the visualisation?','Can they identify the issue?']],['Investigate an issue','You have noticed that response times have increased. Investigate which team or channel is contributing to the change.',['Can they find the correct breakdown?','Can they move from the metric to underlying records?','Do they understand the context?']],['Assign corrective action','You have identified a problem affecting one team. Create an action and assign it to the appropriate person.',['Can they create the action?','Is ownership clear?','Are priority and due date understandable?']],['Track resolution','Return to the issue and determine whether the assigned action has been completed.',['Can they find the issue?','Can they understand its status?','Is the history clear?']]];
function median(a){if(!a.length)return null;a=a.slice().sort(function(x,y){return x-y;});var m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2;}
function vVal(){
  var L=arr('us'),h='<div class="note">Do not set success rates before testing. Run the first sessions to get a baseline, then use what you observe to improve the design. This is a separate stage from discovery interviews: recruit 5-6 relevant participants for moderated prototype testing.</div><div class="cols">'+SCEN.map(function(s,i){return '<div class="card"><h3>Scenario '+(i+1)+': '+s[0]+'</h3><p style="margin:0 0 8px;font-style:italic;color:var(--ink-2)">"'+s[1]+'"</p><div class="tip">Observe</div><ul style="margin:4px 0 0;padding-left:18px;color:var(--ink-2)">'+s[2].map(function(o){return '<li>'+o+'</li>';}).join('')+'</ul></div>';}).join('')+'</div>';
  h+='<div class="card"><h2>Measurement framework</h2><div class="tw"><table><tbody>'+[['Task completion','Whether the participant completes the task'],['Time on task','Time taken to complete the workflow'],['Error rate','Incorrect selections or navigation'],['Assistance required','How often the moderator intervenes'],['Comprehension','Whether the participant understands the information'],['Confidence','Whether they feel able to make the decision']].map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td class="tip">'+r[1]+'</td></tr>';}).join('')+'</tbody></table></div></div>';
  h+='<div class="card"><h2>Session log</h2>';
  if(!L.length)h+='<div class="empty">No test sessions logged.</div>';else h+='<div class="tw"><table style="min-width:900px"><thead><tr><th>Participant</th><th>Scenario</th><th>Outcome</th><th>Time (s)</th><th>Errors</th><th>Assists</th><th>Comprehension 1-5</th><th>Confidence 1-5</th><th>Observation and fix</th><th></th></tr></thead><tbody>'+L.map(function(r,i){return '<tr><td><input type="text" data-ul="'+i+'|p" value="'+esc(r.p)+'" style="width:70px"></td><td><select data-ul="'+i+'|s">'+SCEN.map(function(s,k){return '<option value="'+k+'"'+(r.s==k?' selected':'')+'>'+(k+1)+'. '+s[0]+'</option>';}).join('')+'</select></td><td><select data-ul="'+i+'|o">'+['','Completed','Completed with help','Not completed'].map(function(o){return '<option'+(r.o===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select></td>'+['t','e','a','c','f'].map(function(k){return '<td><input type="number" data-ul="'+i+'|'+k+'" value="'+(r[k]==null?'':r[k])+'" style="width:64px"></td>';}).join('')+'<td><textarea data-ul="'+i+'|n" rows="2">'+esc(r.n||'')+'</textarea></td><td><button class="btn sm del" data-act="dellog" data-i="'+i+'">✕</button></td></tr>';}).join('')+'</tbody></table></div>';
  h+='<div style="margin-top:10px"><button class="btn pri sm" data-act="addlog">Add session row</button></div></div>';
  h+='<div class="card"><h2>Baseline so far</h2>'+(L.length?'<div class="tw"><table><thead><tr><th>Scenario</th><th>Sessions</th><th>Completed</th><th>With help</th><th>Not completed</th><th>Median time</th><th>Mean errors</th></tr></thead><tbody>'+SCEN.map(function(s,k){var r=L.filter(function(x){return x.s==k&&x.o;}),t=r.map(function(x){return x.t;}).filter(function(x){return typeof x==='number';}),er=r.map(function(x){return x.e;}).filter(function(x){return typeof x==='number';});return '<tr><td>'+(k+1)+'. '+s[0]+'</td><td class="mono">'+r.length+'</td><td class="mono">'+r.filter(function(x){return x.o==='Completed';}).length+'</td><td class="mono">'+r.filter(function(x){return x.o==='Completed with help';}).length+'</td><td class="mono">'+r.filter(function(x){return x.o==='Not completed';}).length+'</td><td class="mono">'+(t.length?median(t)+' s':'-')+'</td><td class="mono">'+(er.length?(er.reduce(function(a,b){return a+b;},0)/er.length).toFixed(1):'-')+'</td></tr>';}).join('')+'</tbody></table></div><p class="tip">With 5-6 sessions these are counts, not rates. Report them as observations.</p>':'<div class="tip">Appears once sessions are logged.</div>')+'</div>';
  return h;
}

/* ===== Measurement ===== */
var EVT=[['dashboard_viewed','user role, date range'],['alert_opened','alert type, severity'],['issue_investigation_started','issue ID, source metric'],['action_created','priority, assigned team'],['action_status_changed','previous and new status'],['issue_resolved','resolution type, elapsed time']];
var IND=['Time from issue detection to investigation','Time from investigation to assignment','Percentage of issues with an owner','Median issue resolution time','Percentage of reopened issues','Weekly active operations users'];
function vMeas(){
  var h='<div class="note warn">These are proposed event names and properties, not tracking data. Instrument them only after the concept is validated.</div><div class="card"><h2>North Star metric</h2><p style="margin:0 0 4px;font-size:16px"><b>Actionable issues resolved within target time</b></p><p class="sub">The proportion of actionable issues resolved within their assigned target window.</p></div>';
  var W=900,H=130,steps=['Signal','Investigation','Action','Resolution'],ev=[['dashboard_viewed','alert_opened'],['issue_investigation_started'],['action_created','action_status_changed'],['issue_resolved']];
  h+='<div class="card"><h2>Event flow</h2><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Events from signal to resolution"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>'+steps.map(function(s,i){var x=10+i*222;return '<rect x="'+x+'" y="14" width="190" height="100" rx="9" fill="var(--surface-2)" stroke="var(--line)"/><text x="'+(x+12)+'" y="36" font-size="13" font-weight="600" fill="var(--ink)">'+s+'</text>'+ev[i].map(function(e,k){return '<text x="'+(x+12)+'" y="'+(60+k*18)+'" font-size="11.5" fill="var(--ink-2)" font-family="var(--mono)">'+e+'</text>';}).join('')+(i<3?'<line x1="'+(x+192)+'" x2="'+(x+218)+'" y1="64" y2="64" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ar)"/>':'');}).join('')+'</svg></div><div class="cols"><div class="card"><h2>Events to instrument</h2><div class="tw"><table><thead><tr><th>Event</th><th>Example properties</th></tr></thead><tbody>'+EVT.map(function(e){return '<tr><td class="mono">'+e[0]+'</td><td>'+e[1]+'</td></tr>';}).join('')+'</tbody></table></div><div style="margin-top:10px"><button class="btn sm" data-act="copyev">Copy as JSON schema</button></div></div><div class="card"><h2>Supporting indicators</h2>'+IND.map(function(x,i){return '<div class="f"><label class="l">'+x+'</label>'+tx(['ind',i],'How we would calculate it')+'</div>';}).join('')+'</div></div>';
  return h;
}

/* ===== Render and events ===== */
var VIEWS={plan:vPlan,recruit:vRec,notes:vNotes,aff:vAff,wf:vWf,jm:vJm,comp:vComp,strat:vStrat,val:vVal,meas:vMeas};
function render(){
  document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(TAB===t[0])+'">'+t[1]+'</button>';}).join('');
  var y=window.scrollY;document.getElementById('view').innerHTML=VIEWS[TAB]();window.scrollTo(0,y);bindDnd();
}
function copy(txt,ok){try{navigator.clipboard.writeText(txt).then(function(){flash(ok||'Copied');},function(){fb(txt);});}catch(e){fb(txt);}}
function fb(txt){var t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');flash('Copied');}catch(e){flash('Select and copy manually');}document.body.removeChild(t);}
function flash(m){var d=document.createElement('div');d.textContent=m;d.setAttribute('role','status');d.style.cssText='position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:30;font-size:13px';document.body.appendChild(d);setTimeout(function(){d.remove();},1800);}
function noteText(n){return ['Participant: '+(n.id||''),'Role: '+(n.role||''),'Company context: '+(n.co||''),'Team size: '+(n.team||''),'Tools: '+(n.tools||''),'Workflow: '+(n.wf||''),'Pain points: '+(n.pain||''),'Workarounds: '+(n.work||''),'Quotes: '+(n.q||''),'Evidence strength: '+(n.ev||''),'Follow-up: '+(n.fu||'')].join('\n');}
document.addEventListener('click',function(e){
  var t=e.target.closest('button,[data-act]');if(!t)return;
  if(t.dataset.tab){TAB=t.dataset.tab;render();window.scrollTo(0,0);return;}
  if(t.dataset.hs){var p=t.dataset.hs.split('|');set(['hyp',p[0],'s'],p[1]);render();return;}
  if(t.dataset.cp!==undefined){cp=parseInt(t.dataset.cp,10);render();return;}
  if(t.dataset.sc2){var q=t.dataset.sc2.split('|'),di=parseInt(q[0],10);set(['comp',cp,di],q[1]==='NA'?'NA':q[1]==='clear'?null:parseInt(q[1],10));render();return;}
  if(t.dataset.emo){var m=t.dataset.emo.split('|'),i=parseInt(m[0],10),v=parseInt(m[1],10);set(['jm','emo',i],get(['jm','emo',i],null)===v?null:v);render();return;}
  if(t.dataset.flag){var f=t.dataset.flag.split('|'),c=parseInt(f[1],10);set(['wf','f',f[0],c],!get(['wf','f',f[0],c],false));render();return;}
  var a=t.dataset.act;if(!a)return;var i2=parseInt(t.dataset.i,10);
  switch(a){
   case 'addpart':var P=arr('part');if(P.length>=10&&!window.confirmed){}P.push({id:pid(P.length+1),type:document.getElementById('np-type').value,size:document.getElementById('np-size').value,maturity:document.getElementById('np-mat').value,source:document.getElementById('np-src').value,company:document.getElementById('np-co').value.trim(),status:'Screened'});save();render();break;
   case 'delpart':arr('part').splice(i2,1);save();render();break;
   case 'consentfill':set(['consent'],CONSENT);render();break;
   case 'copyc':copy(get(['consent'],''));break;
   case 'addnote':arr('notes').push({id:pid(arr('notes').length+1)});save();curNote=arr('notes').length-1;render();break;
   case 'opennote':curNote=i2;render();break;
   case 'delnote':arr('notes').splice(i2,1);save();curNote=null;render();break;
   case 'copynote':copy(noteText(arr('notes')[curNote]));break;
   case 'tosticky':var n=arr('notes')[curNote],A=aff(),add=function(txt,ev){String(txt||'').split('\n').map(function(s){return s.trim();}).filter(Boolean).forEach(function(s){A.notes.push({t:s,p:n.id||'',e:ev,c:0});});};add(n.q,'Reported');add(n.pain,n.ev||'Reported');save();flash('Sent to the Affinity map tab');break;
   case 'addsticky':var tt=document.getElementById('an-t').value.trim();if(!tt){flash('Enter an observation first');break;}aff().notes.push({t:tt,p:document.getElementById('an-p').value.trim(),e:document.getElementById('an-e').value,c:0});save();render();break;
   case 'delsticky':aff().notes.splice(i2,1);save();render();break;
   case 'addcol':aff().cols.push('Theme '+aff().cols.length);save();render();break;
   case 'addwf':var rw=get(['wf','rows'],[]);rw.push(pid(rw.length+1));set(['wf','rows'],rw);render();break;
   case 'delwf':var rr=get(['wf','rows'],[]);rr.splice(i2,1);set(['wf','rows'],rr);render();break;
   case 'addopp':opps().push({id:uid(),n:'New area',sev:0,freq:0,eff:0,ppl:0});save();render();break;
   case 'delopp':opps().splice(i2,1);save();render();break;
   case 'addlog':arr('us').push({p:'P'+(arr('us').length+1),s:0,o:''});save();render();break;
   case 'dellog':arr('us').splice(i2,1);save();render();break;
   case 'copyev':copy(JSON.stringify(EVT.map(function(x){return{event:x[0],properties:x[1].split(', ')};}),null,2));break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target,b=t.getAttribute('data-b');
  if(b){set(b.split('|').map(function(x){return /^\d+$/.test(x)?parseInt(x,10):x;}),t.value);return;}
  if(t.dataset.colname!==undefined){aff().cols[parseInt(t.dataset.colname,10)]=t.value;save();return;}
  if(t.dataset.on!==undefined){opps()[parseInt(t.dataset.on,10)].n=t.value;save();return;}
  if(t.dataset.os){var o=t.dataset.os.split('|');opps()[parseInt(o[0],10)][o[1]]=parseInt(t.value,10);save();render();return;}
  if(t.dataset.ul){var u=t.dataset.ul.split('|'),row=arr('us')[parseInt(u[0],10)],k=u[1];row[k]=(['t','e','a','c','f'].indexOf(k)>-1)?(t.value===''?null:parseFloat(t.value)):t.value;save();}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.chk){set(['chk',t.dataset.chk],t.checked);render();return;}
  if(t.dataset.sc){var p=t.dataset.sc.split('|'),r=get(['scr','resp'],{});r[SRESP[parseInt(p[1],10)]]=t.checked;set(['scr','resp'],r);render();return;}
  if(t.dataset.cb){set(t.dataset.cb.split('|').map(function(x){return /^\d+$/.test(x)?parseInt(x,10):x;}),t.checked);return;}
  if(t.dataset.ps!==undefined){arr('part')[parseInt(t.dataset.ps,10)].status=t.value;save();return;}
  if(t.dataset.mv!==undefined){aff().notes[parseInt(t.dataset.mv,10)].c=parseInt(t.value,10);save();render();return;}
  if(t.dataset.ul){var u=t.dataset.ul.split('|'),k=u[1];if(k==='s'||k==='o'){arr('us')[parseInt(u[0],10)][k]=k==='s'?parseInt(t.value,10):t.value;save();render();}return;}
  if(t.dataset.rr){render();}
});
function bindDnd(){
  var cards=document.querySelectorAll('.stk'),cols=document.querySelectorAll('.col'),drag=null;
  cards.forEach(function(c){c.addEventListener('dragstart',function(e){drag=parseInt(c.dataset.ni,10);try{e.dataTransfer.setData('text/plain',String(drag));}catch(x){}});});
  cols.forEach(function(c){c.addEventListener('dragover',function(e){e.preventDefault();c.classList.add('over');});c.addEventListener('dragleave',function(){c.classList.remove('over');});c.addEventListener('drop',function(e){e.preventDefault();c.classList.remove('over');if(drag!==null){aff().notes[drag].c=parseInt(c.dataset.col,10);save();drag=null;render();}});});
}
load();render();
})();
</script>

</body></html>
